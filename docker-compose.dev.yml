services:
  photobooth-server-dev:
    image: node:20
    container_name: hellomyphoto-server-dev
    working_dir: /app
    # Runs both backend and frontend development servers concurrently
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx concurrently \"npm run dev\" \"npm run dev:frontend\""
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: dev-secret
      REFRESH_TOKEN_SECRET: dev-refresh-secret
      OPERATOR_EMAIL: operator@hellomyphoto.local
      OPERATOR_PASSWORD: admin123
      ALLOWED_ORIGINS: "*"
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      COOKIE_PATH: /
      VITE_BASE_URL: /
      VITE_SHARE_BASE_URL: ${VITE_SHARE_BASE_URL:-http://localhost:3001/snapsync/share}

      STORAGE_ROOT: /app
    volumes:
      - ./photobooth-server:/app
      - ./shared:/shared
      - /app/node_modules
      - /shared/node_modules
    restart: unless-stopped

  photobooth-share-dev:
    image: node:20
    container_name: hellomyphoto-share-dev
    working_dir: /app
    command: sh -c "cd /shared && npm install && cd /app && npm install && npx concurrently \"npm run dev\" \"npm run dev:frontend\""
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      SHARE_BASE_URL: http://localhost:3001/snapsync
      ADMIN_INTERNAL_URL: http://photobooth-server-dev:3000
      INTERNAL_API_SECRET: dev-internal-secret
      STORAGE_ROOT: /app
    volumes:
      - ./photobooth-share:/app
      - ./photobooth-server/storage:/app/storage

      - ./shared:/shared
      - /app/node_modules
      - /shared/node_modules
    restart: unless-stopped
