services:
  photobooth-server:
    image: ghcr.io/kahmeng15/hellomyphoto-server:latest
    container_name: hellomyphoto-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./storage/photos:/app/storage/photos
      - ./storage/frames:/app/storage/frames
      - ./storage/logs:/app/storage/logs
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
